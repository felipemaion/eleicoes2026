name: Imagem ETL (redes)

# Imagem arm64 da coleta diária de redes (T-D09): o servidor só faz pull; não builda (CPU no teto).
# O pacote GHCR nasce PRIVADO — o orquestrador precisa torná-lo público uma vez (Package settings).
on:
  push:
    branches: [main]
    paths: ["packages/etl/**", "packages/contratos/**", "config/**", "uv.lock", ".github/workflows/imagem-etl.yml"]
  workflow_dispatch:

concurrency:
  group: imagem-etl
  cancel-in-progress: false

env:
  IMAGEM: ghcr.io/felipemaion/eleicoes2026-etl

jobs:
  imagem:
    name: Imagem ETL (arm64)
    runs-on: ubuntu-24.04-arm
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/etl/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGEM }}:latest
            ${{ env.IMAGEM }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
