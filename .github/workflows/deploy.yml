name: Deploy

# Publica em eleicoes2026.maionesys.com (servidor provisionado pelo agente Oracle; docs/deploy.md).
# - API: imagem arm64 construída aqui (o servidor tem só 2 OCPU compartilhadas) e publicada no GHCR;
#   o servidor só faz pull + up via deploy.sh (chave com forced-command).
# - Web: bundle do Vite enviado por rsync para public/ (servido por Caddy próprio, com Range).
#   tiles/ e datasets/ vêm do ETL local e não são tocados aqui.
on:
  push:
    branches: [main]
    paths: ["apps/**", "packages/**", "config/**", "docs/metodologia/publico/**", "pyproject.toml", "uv.lock", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-producao
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGEM: ghcr.io/felipemaion/eleicoes2026-api

jobs:
  imagem-api:
    name: Imagem da API (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGEM }}:latest
            ${{ env.IMAGEM }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web:
    name: Bundle web
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Chave e known_hosts
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.RSYNC_SSH_KEY }}" > ~/.ssh/rsync && chmod 600 ~/.ssh/rsync
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: rsync do bundle (preserva tiles/)
        # O destino é imposto pelo servidor (rrsync preso a public/). --delete remove assets antigos,
        # mas tiles/ é excluído para não apagar os PMTiles enviados pelo ETL.
        run: >
          rsync -az --delete --exclude 'tiles/'
          -e "ssh -i ~/.ssh/rsync -o IdentitiesOnly=yes"
          dist/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:"

  deploy:
    name: Deploy no servidor
    needs: [imagem-api, web]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Chave e known_hosts
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Dispara deploy.sh (forced-command; gate de health no servidor)
        run: ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" deploy
      - name: Verificação pública
        run: |
          curl -fsS https://eleicoes2026.maionesys.com/api/health
          curl -fsS -o /dev/null https://eleicoes2026.maionesys.com/
