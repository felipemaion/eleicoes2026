# Grupos comparáveis (ADR 0005). Novo partido/grupo = nova entrada; nenhum código muda.
# Critérios combinados por união: partido OU candidatura listada.
grupos:
  missao_2026:
    rotulo: "Partido Missão 2026"
    ano: 2026
    criterio:
      partido: 14
  mbl_2026:
    rotulo: "MBL 2026 (Missão + aliados em outros partidos)"
    ano: 2026
    criterio:
      partido: 14
      lista: {arquivo: data/reference/mbl_2022.csv, coluna: sq_candidato_2026}  # inclui Beraldo (PP)
  mbl_2022:
    rotulo: "MBL 2022"
    ano: 2022
    criterio:
      lista: {arquivo: data/reference/mbl_2022.csv, coluna: sq_candidato}
  mbl_2022_indicados:
    rotulo: "MBL 2022 — indicados"
    ano: 2022
    criterio:
      lista: {arquivo: data/reference/mbl_2022.csv, coluna: sq_candidato, filtro: {origem: indicado}}
comparacoes:
  evolucao_mbl:
    rotulo: "MBL 2022 → MBL 2026"
    de: mbl_2022
    para: mbl_2026
  evolucao_missao:
    rotulo: "MBL 2022 → Partido Missão 2026"
    de: mbl_2022
    para: missao_2026
