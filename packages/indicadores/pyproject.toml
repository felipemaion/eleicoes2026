[project]
name = "indicadores"
version = "0.1.0"
description = "Indicadores eleitorais: funções puras polars→polars (papel analise)."
requires-python = ">=3.12"
dependencies = ["polars>=1.10", "contratos"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indicadores"]

[tool.uv.sources]
contratos = { workspace = true }
