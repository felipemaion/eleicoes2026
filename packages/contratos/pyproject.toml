[project]
name = "contratos"
version = "0.1.0"
description = "Schemas Parquet e enums compartilhados (papel dados)."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8", "polars>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contratos"]
