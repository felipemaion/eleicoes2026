[project]
name = "etl"
version = "0.1.0"
description = "ETL de dados oficiais TSE/IBGE/BCB → Parquet (papel dados)."
requires-python = ">=3.12"
dependencies = ["polars>=1.10", "httpx>=0.27", "contratos"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etl"]

[tool.uv.sources]
contratos = { workspace = true }
