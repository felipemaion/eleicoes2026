# Grupos do mundo da T-B20 (mesma forma de config/grupos.yaml).
grupos:
  missao_2026:
    rotulo: "Partido Missão 2026"
    rotulo_curto: "Missão"
    ano: 2026
    criterio: {partido: 14}
  presidenciaveis_2026:
    rotulo: "Presidenciáveis 2026"
    ano: 2026
    rotulo_lado: "{n} presidenciáveis"
    criterio:
      sqs: [13, 14, 11, 999999]   # 999999 não existe nos dados: é ignorado, não é erro
  top5_eleitos_outros_2026:
    rotulo: "5 eleitos mais votados de outros partidos (2026)"
    ano: 2026
    rotulo_lado: "{n} eleitos mais votados de outros partidos em {uf}"
    criterio:
      ranking: {cargos: [DEPUTADO FEDERAL, DEPUTADO ESTADUAL], resultado: eleito, n: 5, por: uf, excluir_partido: 14}
referencias:
  nossos: missao_2026
  contra: [presidenciaveis_2026, top5_eleitos_outros_2026]
