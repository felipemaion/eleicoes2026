[project]
name = "eleicoes2026"
version = "0.1.0"
description = "Dashboard de desempenho do Partido Missão — monorepo (workspace uv)"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
# A raiz instala todos os membros para que `uv sync` + `pytest` cubram o monorepo inteiro.
dependencies = ["contratos", "indicadores", "etl", "api"]

[tool.uv.sources]
contratos = { workspace = true }
indicadores = { workspace = true }
etl = { workspace = true }
api = { workspace = true }

[tool.uv.workspace]
members = ["packages/contratos", "packages/indicadores", "packages/etl", "apps/api"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pytest-httpserver>=1.1", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "S", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]  # acentos em texto pt-BR são intencionais

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
# scripts/ rodam com o python3 do sistema (pode ser 3.10): sem datetime.UTC
"scripts/*.py" = ["UP017"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = ["packages/contratos/src", "packages/indicadores/src", "packages/etl/src", "apps/api/src"]
explicit_package_bases = true

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["scripts/tests", "packages/contratos/tests", "packages/indicadores/tests", "packages/etl/tests", "apps/api/tests"]
addopts = "-q --import-mode=importlib"

[tool.coverage.run]
source = ["scripts", "packages/contratos/src", "packages/indicadores/src", "packages/etl/src", "apps/api/src"]
omit = ["scripts/tests/*"]
